services:
  falkordb:
    image: falkordb/falkordb:6.0.2   # pinned: Rust engine, verified 2026-10-14
    container_name: lineage-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # Redis protocol (local only)
      - "127.0.0.1:3000:3000"   # FalkorDB Browser
    environment:
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 5000 TIMEOUT_MAX 30000 RESULTSET_SIZE 10000"
      REDIS_ARGS: "${REDIS_ARGS:-}"   # set to "--requirepass <pw>" when deployed
    volumes:
      - lineage-falkordb-data:/var/lib/falkordb/data

volumes:
  lineage-falkordb-data:
    external: true
