[project]
name = "lineage"
version = "0.1.0"
description = "A company brain that un-learns — FalkorDB Graph Hacks 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.14.0",
  "claude-agent-sdk>=0.2.167",
  "falkordb>=1.2",
  "fastapi>=0.143.1",
  "fastembed>=0.9.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0.3",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["slow: downloads models or hits the network"]
